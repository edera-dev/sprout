name: zizmor

on:
  pull_request:
    branches:
    - main
  push:
    branches:
    - main

permissions:
  contents: read # Needed to checkout the repository.

concurrency:
  group: "${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}"
  # Only cancel superseded pull request runs, so every push to main is fully checked.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    permissions:
      security-events: write # Needed to upload code scanning results.
      contents: read # Needed to checkout the repository.
      actions: read # Needed to analyze action metadata.
    steps:
    - name: harden runner
      uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
      with:
        egress-policy: audit

    - name: checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: setup uv
      uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

    - name: zizmor
      run: uvx zizmor --pedantic --format sarif . > results.sarif
      env:
        GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

    - name: upload
      uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
      with:
        sarif_file: results.sarif
        category: zizmor
